spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/nonvoy
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # Sxemani faqat Flyway o'zgartiradi (db/migration). Hibernate ishga tushishda
      # entity'lar bazaga mosligini tekshiradi: migratsiya esdan chiqsa dastur ko'tarilmaydi
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

bot:
  token: ${BOT_TOKEN}
  username: ${BOT_USERNAME}
  admin-group-id: ${ADMIN_GROUP_ID}
  worker-group-id: ${WORKER_GROUP_ID}
  # Vaqtinchalik dummy qiymatlar - novvoydan olingach env orqali almashtiriladi
  payment-card: ${PAYMENT_CARD:8600 1234 5678 9012}
  payment-card-holder: ${PAYMENT_CARD_HOLDER:Ism Familiya}
