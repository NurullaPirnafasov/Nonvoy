spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nonvoy}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # Sxemani faqat Flyway o'zgartiradi (db/migration). Hibernate ishga tushishda
      # entity'lar bazaga mosligini tekshiradi: migratsiya esdan chiqsa dastur ko'tarilmaydi
      ddl-auto: validate

bot:
  token: ${BOT_TOKEN}
  username: ${BOT_USERNAME}
  admin-group-id: ${ADMIN_GROUP_ID}
  worker-group-id: ${WORKER_GROUP_ID}
  # Default qiymat YO'Q: env unutilsa bot mijozga soxta karta ko'rsatib, pul noma'lum
  # kartaga ketmasin — dastur ishga tushmay qo'ya qolsin
  payment-card: ${PAYMENT_CARD}
  payment-card-holder: ${PAYMENT_CARD_HOLDER}
