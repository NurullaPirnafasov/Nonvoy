spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/nonvoy
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

bot:
  token: ${BOT_TOKEN}
  username: ${BOT_USERNAME}
  admin-group-id: ${ADMIN_GROUP_ID}
  worker-group-id: ${WORKER_GROUP_ID}
  # Vaqtinchalik dummy qiymatlar - novvoydan olingach env orqali almashtiriladi
  payment-card: ${PAYMENT_CARD:8600 1234 5678 9012}
  payment-card-holder: ${PAYMENT_CARD_HOLDER:Ism Familiya}
  # api.telegram.org O'zbekistondan to'siladi — lokalda proxy kerak bo'ladi.
  # NO_PROXY | HTTP | SOCKS4 | SOCKS5. Chet eldagi VPS'da o'chiq qoladi.
  proxy:
    type: ${BOT_PROXY_TYPE:NO_PROXY}
    host: ${BOT_PROXY_HOST:}
    port: ${BOT_PROXY_PORT:0}
